# frontend/nginx.conf
# Serves the built SPA and proxies /api to the backend container.
# The browser only ever talks to Nginx: one origin, no CORS config
# needed anywhere, which is the cleanest answer to "how did you
# handle CORS" (you architected it away).

server {
    listen 80;
    server_name _;

    # container healthcheck target — must stay on plain HTTP,
    # Docker's HEALTHCHECK hits this directly and never follows
    # a redirect
    location = /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Everything else on 80 goes straight to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/pulseops-app.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulseops-app.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the HTML shell; hashed assets cache forever.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: client-side routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}