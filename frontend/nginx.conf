# frontend/nginx.conf
# Serves the built SPA and proxies /api to the backend container.
# The browser only ever talks to Nginx: one origin, no CORS config
# needed anywhere, which is the cleanest answer to "how did you
# handle CORS" (you architected it away).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the HTML shell; hashed assets cache forever.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: client-side routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # container healthcheck target
    location = /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
