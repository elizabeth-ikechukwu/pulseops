# docker-compose.yml
# Full local stack: Postgres 16, Redis 7, backend API, frontend (Nginx).
# App entrypoint: http://localhost:8080 (Nginx serves the SPA and
# proxies /api to the backend).
#
# Usage:
#   cp backend/.env.example backend/.env   (fill in JWT secrets)
#   docker compose up --build
#
# Note on migrations: locally the backend container runs them on boot
# for convenience. In a real deployment, migrations run as a separate
# deploy step (CI job / init container), never inside the app process.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulseops
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: ${PGPASSWORD:-localdev123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseops -d pulseops"]
      interval: 5s
      timeout: 3s
      retries: 10
    # port published for psql/GUI access during dev; remove in prod
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # container networking overrides localhost values from .env
      PGHOST: postgres
      REDIS_URL: redis://redis:6379
    command: ["dumb-init", "--", "sh", "-c", "node scripts/migrate.js && node server.js"]
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
